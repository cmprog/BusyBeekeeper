<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <title>Busy Beekeeper</title>
    <meta name="description" content="A time-management beekeeping game." />
    <meta name="theme-color" content="#1f1a14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <style>
      /* Colours mirror src/game/theme.ts: #1f1a14 = palette.bark, #f5e8c4 = palette.cream */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1f1a14;
      }

      /* The game is landscape-only (ROADMAP §3.8). On touch devices held in portrait,
         cover the game with a prompt to rotate. */
      #rotate-hint {
        display: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint {
          display: flex;
          position: fixed;
          inset: 0;
          z-index: 10;
          align-items: center;
          justify-content: center;
          flex-direction: column;
          gap: 12px;
          background: #1f1a14;
          color: #f5e8c4;
          font:
            600 20px system-ui,
            sans-serif;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <div id="rotate-hint"><span style="font-size: 48px">🐝↻</span>Rotate your device to play</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
